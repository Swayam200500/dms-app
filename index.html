<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Monitoring System</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: #121212; 
            color: #fff; 
            font-family: Arial, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: flex-start; 
            min-height: 100vh; 
            padding-top: 20px;
        }
        h2 { margin-bottom: 12px; font-size: 18px; text-transform: uppercase; letter-spacing: 1px; color: #38bdf8; }
        
        #container { 
            position: relative; 
            width: 90vw; 
            max-width: 640px; 
            aspect-ratio: 4/3; 
            border: 3px solid #333; 
            border-radius: 12px; 
            overflow: hidden; 
            background: #000;
            flex-shrink: 0;
        }
        
        video, canvas { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100% !important; 
            height: 100% !important; 
            object-fit: contain !important; 
            object-position: center !important;
            transform: scaleX(-1); 
        }
        
        /* FIXED LOCKED BOX UI — NO JUMPING / NO SHIFTING */
        #status-box { 
            margin-top: 15px; 
            width: 90vw; 
            max-width: 640px; 
            height: 125px; /* Locked fixed height prevents jumping */
            padding: 14px 16px; 
            border-radius: 8px; 
            background: rgba(0,0,0,0.85); 
            border-left: 6px solid #00ffcc; 
            box-sizing: border-box;
            overflow: hidden;
        }
        
        .state-title { font-size: 15px; font-weight: bold; line-height: 1.2; margin-bottom: 4px; }
        .metrics-line { font-size: 13px; color: #cbd5e1; line-height: 1.3; margin-bottom: 4px; }
        .action-line { font-size: 13px; color: #fff; line-height: 1.3; font-weight: 600; }
    </style>
</head>
<body>
    <h2>Driver Monitoring System</h2>
    <div id="container">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="output_canvas"></canvas>
    </div>
    <div id="status-box">
        <div class="state-title" style="color:#00ffcc">INITIALIZING ENGINE...</div>
        <div class="metrics-line">Loading FaceMesh & Vision Core</div>
        <div class="action-line">Calibrating Monitoring Stream</div>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const statusBox = document.getElementById('status-box');

        const sampleCanvas = document.createElement('canvas');
        const sampleCtx = sampleCanvas.getContext('2d', { willReadFrequently: true });

        let facialLossStartTime = 0;
        let phoneDetected = false;
        let cocoModel = null;

        // 3-frame buffer majority vote
        let seatbeltBuffer = [false, false, false];

        cocoSsd.load().then(model => {
            cocoModel = model;
            detectPhone();
        });

        async function detectPhone() {
            if (cocoModel && videoElement.readyState === 4) {
                try {
                    const predictions = await cocoModel.detect(videoElement);
                    phoneDetected = predictions.some(p => p.class === 'cell phone' && p.score > 0.40);
                } catch(e) {}
            }
            setTimeout(detectPhone, 500);
        }

        function getDistance(p1, p2) {
            return Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2));
        }

        function calculateEAR(landmarks, left) {
            const p = left ? [33, 160, 158, 133, 153, 144] : [263, 387, 385, 362, 380, 373];
            const v1 = getDistance(landmarks[p[1]], landmarks[p[5]]);
            const v2 = getDistance(landmarks[p[2]], landmarks[p[4]]);
            const h = getDistance(landmarks[p[0]], landmarks[p[3]]);
            return (v1 + v2) / (2.0 * h);
        }

        function calculateMAR(landmarks) {
            const vertical = getDistance(landmarks[13], landmarks[14]);
            const horizontal = getDistance(landmarks[78], landmarks[308]);
            return vertical / horizontal;
        }

        // --- ACCURATE SEATBELT STRAP INTERSECTION SAMPLING ---
        function checkSeatbeltFastened(landmarks, w, h) {
            if (!landmarks || landmarks.length < 153) return false;

            if (sampleCanvas.width !== w || sampleCanvas.height !== h) {
                sampleCanvas.width = w;
                sampleCanvas.height = h;
            }

            sampleCtx.drawImage(videoElement, 0, 0, w, h);

            const chin = landmarks[152];
            
            // Start scan vector lower on neck/chest
            const startX = Math.floor(chin.x * w);
            const startY = Math.floor(chin.y * h) + Math.floor(h * 0.06);
            
            // Project vector dynamically across strap path (Right shoulder down to Left hip)
            const endX = Math.min(w - 10, startX + Math.floor(w * 0.35));
            const endY = Math.min(h - 10, startY + Math.floor(h * 0.40));

            let darkStrapHits = 0;
            const samples = 20;

            try {
                const imgData = sampleCtx.getImageData(0, 0, w, h).data;

                for (let i = 0; i <= samples; i++) {
                    const sx = Math.floor(startX + (endX - startX) * (i / samples));
                    const sy = Math.floor(startY + (endY - startY) * (i / samples));

                    if (sx >= 0 && sx < w && sy >= 0 && sy < h) {
                        const idx = (sy * w + sx) * 4;
                        const r = imgData[idx];
                        const g = imgData[idx + 1];
                        const b = imgData[idx + 2];
                        const luminance = (0.299 * r) + (0.587 * g) + (0.114 * b);

                        // Detect dark strap pixels (Luminance < 110)
                        if (luminance < 110) {
                            darkStrapHits++;
                        }
                    }
                }
            } catch (e) {
                return false;
            }

            // Strap detected if >= 20% of vector points cross dark strap fabric
            const rawBeltOn = (darkStrapHits / samples) >= 0.20;

            seatbeltBuffer.shift();
            seatbeltBuffer.push(rawBeltOn);
            return seatbeltBuffer.filter(Boolean).length >= 2;
        }

        const faceMesh = new FaceMesh({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
        });

        faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });

        faceMesh.onResults((results) => {
            const w = canvasElement.width = videoElement.videoWidth || 640;
            const h = canvasElement.height = videoElement.videoHeight || 480;

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, w, h);
            canvasCtx.drawImage(results.image, 0, 0, w, h);

            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                facialLossStartTime = 0;
                const landmarks = results.multiFaceLandmarks[0];

                const leftEAR = calculateEAR(landmarks, true);
                const rightEAR = calculateEAR(landmarks, false);
                const ear = (leftEAR + rightEAR) / 2.0;
                const mar = calculateMAR(landmarks);
                
                const isSeatbeltOn = checkSeatbeltFastened(landmarks, w, h);

                // Draw Visual Scan Vector along diagonal strap trajectory
                const chin = landmarks[152];
                const sX = chin.x * w;
                const sY = chin.y * h + (h * 0.06);
                const eX = Math.min(w - 10, sX + (w * 0.35));
                const eY = Math.min(h - 10, sY + (h * 0.40));

                canvasCtx.beginPath();
                canvasCtx.moveTo(sX, sY);
                canvasCtx.lineTo(eX, eY);
                canvasCtx.strokeStyle = isSeatbeltOn ? "#00ffcc" : "#ff00ea";
                canvasCtx.lineWidth = 4;
                canvasCtx.stroke();

                if (!isSeatbeltOn) {
                    updateStatus("STATE 6: NO SEATBELT DETECTED", `Strap Scan Failed | EAR: ${ear.toFixed(2)} | MAR: ${mar.toFixed(2)}`, "Fasten Seatbelt Across Torso", "#ff00ea");
                } else if (phoneDetected) {
                    updateStatus("STATE 5: DISTRACTED (PHONE USE)", "Detected Mobile Device in View", "Put Down Mobile Phone", "#ff0055");
                } else if (ear < 0.17) {
                    updateStatus("STATE 2: MICROSLEEP DETECTED", `EAR = ${ear.toFixed(2)} (< 0.17 Threshold)`, "CRITICAL ALERT: Wake Up!", "#ff3300");
                } else if (mar > 0.50) {
                    updateStatus("STATE 3: YAWNING DETECTED", `MAR = ${mar.toFixed(2)} (> 0.50 Threshold)`, "Warning: Rest Required", "#ffcc00");
                } else {
                    updateStatus("STATE 1: SAFE DRIVING", `EAR: ${ear.toFixed(2)} | MAR: ${mar.toFixed(2)} | Seatbelt: OK`, "Normal Operating Mode", "#00ffcc");
                }
            } else {
                const currentTime = Date.now();
                if (facialLossStartTime === 0) {
                    facialLossStartTime = currentTime;
                } else if (currentTime - facialLossStartTime > 2500) {
                    updateStatus("STATE 4: CRITICAL FACIAL LOSS", "No Face Tracked > 2.5s", "Focus Eyes on Road Immediately", "#ff0000");
                    canvasCtx.restore();
                    return;
                }
                updateStatus("TRACKING FACE...", "Searching for Driver Landmarks", "Monitoring Stream Active", "#aaaaaa");
            }
            canvasCtx.restore();
        });

        function updateStatus(state, metric, action, color) {
            statusBox.style.borderColor = color;
            statusBox.innerHTML = `
                <div class="state-title" style="color:${color}">${state}</div>
                <div class="metrics-line">${metric}</div>
                <div class="action-line">Action: ${action}</div>
            `;
        }

        const camera = new Camera(videoElement, {
            onFrame: async () => { await faceMesh.send({ image: videoElement }); },
            width: 640, height: 480
        });
        camera.start();
    </script>
</body>
</html>
