<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Monitoring System</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    <style>
        body { margin: 0; background-color: #121212; color: #fff; font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        #container { position: relative; width: 90vw; max-width: 640px; aspect-ratio: 4/3; border: 3px solid #333; border-radius: 12px; overflow: hidden; }
        video, canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: contain; /* FIX: Prevents cropping/zooming, shows true full camera view */
    transform: scaleX(-1);
}
        #status-box { margin-top: 15px; width: 85vw; max-width: 600px; padding: 16px; border-radius: 8px; background: rgba(0,0,0,0.85); border-left: 6px solid #00ffcc; font-size: 16px; font-weight: bold; line-height: 1.5; box-sizing: border-box; }
    </style>
</head>
<body>
    <h2>Driver Monitoring System</h2>
    <div id="container">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="output_canvas"></canvas>
    </div>
    <div id="status-box">INITIALIZING ENGINE...</div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d', { willReadFrequently: true });
        const statusBox = document.getElementById('status-box');

        let facialLossStartTime = 0;
        let phoneDetected = false;
        let cocoModel = null;

        // Smooth history filter to avoid split-second seatbelt flickering
        let seatbeltBuffer = [true, true, true, true, true];

        cocoSsd.load().then(model => {
            cocoModel = model;
            detectPhone();
        });

        async function detectPhone() {
            if (cocoModel && videoElement.readyState === 4) {
                try {
                    const predictions = await cocoModel.detect(videoElement);
                    phoneDetected = predictions.some(p => p.class === 'cell phone' && p.score > 0.40);
                } catch(e) {}
            }
            setTimeout(detectPhone, 500);
        }

        function getDistance(p1, p2) {
            return Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2));
        }

        function calculateEAR(landmarks, left) {
            const p = left ? [33, 160, 158, 133, 153, 144] : [263, 387, 385, 362, 380, 373];
            const v1 = getDistance(landmarks[p[1]], landmarks[p[5]]);
            const v2 = getDistance(landmarks[p[2]], landmarks[p[4]]);
            const h = getDistance(landmarks[p[0]], landmarks[p[3]]);
            return (v1 + v2) / (2.0 * h);
        }

        function calculateMAR(landmarks) {
            const vertical = getDistance(landmarks[13], landmarks[14]);
            const horizontal = getDistance(landmarks[78], landmarks[308]);
            return vertical / horizontal;
        }

        // Dynamic Torso Luminance Seatbelt Sampling
        function checkSeatbeltFastened(landmarks, w, h) {
            if (!landmarks || landmarks.length < 153) return true;

            const chin = landmarks[152];
            const startX = Math.floor(chin.x * w);
            const startY = Math.floor(chin.y * h) + Math.floor(h * 0.08);
            const endX = Math.max(10, startX - Math.floor(w * 0.30));
            const endY = Math.min(h - 10, startY + Math.floor(h * 0.35));

            let darkPixels = 0;
            const samples = 15;

            try {
                const imgData = canvasCtx.getImageData(0, 0, w, h).data;
                for (let i = 0; i <= samples; i++) {
                    const sx = Math.floor(startX + (endX - startX) * (i / samples));
                    const sy = Math.floor(startY + (endY - startY) * (i / samples));

                    if (sx >= 0 && sx < w && sy >= 0 && sy < h) {
                        const idx = (sy * w + sx) * 4;
                        const r = imgData[idx];
                        const g = imgData[idx + 1];
                        const b = imgData[idx + 2];
                        const luminance = 0.299 * r + 0.587 * g + 0.114 * b;
                        
                        if (luminance < 115) { // Dark strap luminance threshold
                            darkPixels++;
                        }
                    }
                }
            } catch (e) {
                return true;
            }

            const isFrameBeltOn = (darkPixels / samples) >= 0.15;
            seatbeltBuffer.shift();
            seatbeltBuffer.push(isFrameBeltOn);
            return seatbeltBuffer.filter(Boolean).length >= 2;
        }

        const faceMesh = new FaceMesh({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
        });

        faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });

        faceMesh.onResults((results) => {
            const w = canvasElement.width = videoElement.videoWidth || 640;
            const h = canvasElement.height = videoElement.videoHeight || 480;

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, w, h);
            
            // Render video frame onto canvas natively to keep 4:3 unstretched proportions
            canvasCtx.drawImage(results.image, 0, 0, w, h);

            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                facialLossStartTime = 0;
                const landmarks = results.multiFaceLandmarks[0];

                const leftEAR = calculateEAR(landmarks, true);
                const rightEAR = calculateEAR(landmarks, false);
                const ear = (leftEAR + rightEAR) / 2.0;
                const mar = calculateMAR(landmarks);
                
                const isSeatbeltOn = checkSeatbeltFastened(landmarks, w, h);

                // Visual debug vector line across driver torso
                const chin = landmarks[152];
                const sX = chin.x * w;
                const sY = chin.y * h + (h * 0.08);
                const eX = Math.max(10, sX - (w * 0.30));
                const eY = Math.min(h - 10, sY + (h * 0.35));

                canvasCtx.beginPath();
                canvasCtx.moveTo(sX, sY);
                canvasCtx.lineTo(eX, eY);
                canvasCtx.strokeStyle = isSeatbeltOn ? "#00ffcc" : "#ff00ea";
                canvasCtx.lineWidth = 4;
                canvasCtx.stroke();

                // 6-State Prioritized Rule Engine
                if (!isSeatbeltOn) {
                    updateStatus("STATE 6: NO SEATBELT DETECTED", `Torso Strap Missing | EAR: ${ear.toFixed(2)} | MAR: ${mar.toFixed(2)}`, "Fasten Seatbelt", "#ff00ea");
                } else if (phoneDetected) {
                    updateStatus("STATE 5: DISTRACTED (PHONE USE)", "Detected mobile phone", "Critical Alert", "#ff0055");
                } else if (ear < 0.17) {
                    updateStatus("STATE 2: MICROSLEEP DETECTED", `EAR = ${ear.toFixed(2)} (< 0.17)`, "Sound Alarm", "#ff3300");
                } else if (mar > 0.50) {
                    updateStatus("STATE 3: YAWNING DETECTED", `MAR = ${mar.toFixed(2)} (> 0.50)`, "Rest Warning", "#ffcc00");
                } else {
                    updateStatus("STATE 1: SAFE DRIVING", `EAR: ${ear.toFixed(2)} | MAR: ${mar.toFixed(2)} | Seatbelt: OK`, "Normal", "#00ffcc");
                }
            } else {
                const currentTime = Date.now();
                if (facialLossStartTime === 0) {
                    facialLossStartTime = currentTime;
                } else if (currentTime - facialLossStartTime > 2500) {
                    updateStatus("STATE 4: CRITICAL FACIAL LOSS / HEAD TURNED BACK", "No face tracked > 2.5s", "Loud Alert Warning", "#ff0000");
                    canvasCtx.restore();
                    return;
                }
                updateStatus("TRACKING FACE...", "Searching for driver landmarks", "Monitoring", "#aaaaaa");
            }
            canvasCtx.restore();
        });

        function updateStatus(state, metric, action, color) {
            statusBox.style.borderColor = color;
            statusBox.innerHTML = `<span style="color:${color}">${state}</span><br>${metric}<br>Action: ${action}`;
        }

        const camera = new Camera(videoElement, {
            onFrame: async () => { await faceMesh.send({ image: videoElement }); },
            width: 640, height: 480
        });
        camera.start();
    </script>
</body>
</html>
