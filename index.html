<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Driver Monitoring System (DMS)</title>
    <link rel="manifest" href="manifest.json">
    <!-- MediaPipe & TensorFlow CDN Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    <style>
        * { box-sizing: border-box; }
        body { 
            margin: 0; 
            background-color: #0f172a; 
            color: #fff; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: flex-start; 
            min-height: 100vh; 
            padding: 12px;
        }
        h2 { margin: 8px 0; font-size: 18px; color: #38bdf8; text-transform: uppercase; letter-spacing: 1px; }
        #container { 
            position: relative; 
            width: 100%; 
            max-width: 480px; 
            height: 360px; /* Fixed proportional viewport */
            border: 2px solid #334155; 
            border-radius: 12px; 
            overflow: hidden; 
            background-color: #000;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }
        /* Fixed Video Stretching Issue via object-fit: cover */
        video, canvas { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            object-fit: cover;
            transform: scaleX(-1); /* Front camera mirror mode */
        }
        #status-box { 
            margin-top: 12px; 
            width: 100%; 
            max-width: 480px; 
            padding: 14px; 
            border-radius: 8px; 
            background: #1e293b; 
            border-left: 6px solid #00ffcc; 
            font-size: 14px; 
            font-weight: 600; 
            line-height: 1.4; 
        }
        .state-title { font-size: 16px; font-weight: 800; letter-spacing: 0.5px; }
        .metrics { font-size: 12px; color: #94a3b8; margin-top: 4px; }
    </style>
</head>
<body>

    <h2>Driver Safety Engine (30 FPS)</h2>
    <div id="container">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="output_canvas"></canvas>
    </div>
    <div id="status-box">
        <div class="state-title" style="color: #00ffcc;">INITIALIZING ENGINE...</div>
        <div class="metrics">Calibrating FaceMesh & Object Recognition...</div>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d', { willReadFrequently: true });
        const statusBox = document.getElementById('status-box');

        let facialLossStartTime = 0;
        let phoneDetected = false;
        let cocoModel = null;

        // Smooth seatbelt state persistence filter to eliminate flicker
        let seatbeltHistory = [true, true, true, true, true];

        // Load COCO-SSD Model for Phone Detection
        cocoSsd.load().then(model => {
            cocoModel = model;
            detectPhone();
        });

        async function detectPhone() {
            if (cocoModel && videoElement.readyState === 4) {
                try {
                    const predictions = await cocoModel.detect(videoElement);
                    phoneDetected = predictions.some(p => p.class === 'cell phone' && p.score > 0.40);
                } catch (e) {}
            }
            setTimeout(detectPhone, 500);
        }

        function getDistance(p1, p2) {
            return Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2));
        }

        function calculateEAR(landmarks, isLeft) {
            const p = isLeft ? [33, 160, 158, 133, 153, 144] : [263, 387, 385, 362, 380, 373];
            const v1 = getDistance(landmarks[p[1]], landmarks[p[5]]);
            const v2 = getDistance(landmarks[p[2]], landmarks[p[4]]);
            const h = getDistance(landmarks[p[0]], landmarks[p[3]]);
            return (v1 + v2) / (2.0 * h);
        }

        function calculateMAR(landmarks) {
            const vertical = getDistance(landmarks[13], landmarks[14]);
            const horizontal = getDistance(landmarks[78], landmarks[308]);
            return vertical / horizontal;
        }

        // --- STABLE ADAPTIVE SEATBELT SAMPLING ---
        function checkSeatbeltFastened(landmarks, width, height) {
            if (!landmarks || landmarks.length < 153) return true;

            const chin = landmarks[152];
            
            // Generate torso vector starting below chin down across shoulder line
            const startX = Math.floor(chin.x * width);
            const startY = Math.floor(chin.y * height) + Math.floor(height * 0.10);
            const endX = Math.max(10, startX - Math.floor(width * 0.35));
            const endY = Math.min(height - 10, startY + Math.floor(height * 0.40));

            let darkPixelCount = 0;
            const samples = 15;

            try {
                // Direct Canvas Sampling
                const frameData = canvasCtx.getImageData(0, 0, width, height).data;

                for (let i = 0; i <= samples; i++) {
                    const sx = Math.floor(startX + (endX - startX) * (i / samples));
                    const sy = Math.floor(startY + (endY - startY) * (i / samples));

                    if (sx >= 0 && sx < width && sy >= 0 && sy < height) {
                        const idx = (sy * width + sx) * 4;
                        const r = frameData[idx];
                        const g = frameData[idx + 1];
                        const b = frameData[idx + 2];

                        // Perceptual Luminance Formula
                        const luminance = (0.299 * r) + (0.587 * g) + (0.114 * b);

                        // Strap threshold (Luminance < 115 covers dark seatbelts under varying lights)
                        if (luminance < 115) {
                            darkPixelCount++;
                        }
                    }
                }
            } catch (e) {
                return true; // Safety fallback
            }

            // Raw frame detection trigger: Strap present if at least 15% of line pixels are dark
            const rawDetected = (darkPixelCount / samples) >= 0.15;

            // Rolling History Buffer to eliminate single-frame flickering
            seatbeltHistory.shift();
            seatbeltHistory.push(rawDetected);

            // True if majority of last 5 frames confirmed seatbelt
            const positiveVotes = seatbeltHistory.filter(Boolean).length;
            return positiveVotes >= 2;
        }

        // --- MEDIAPIPE ENGINE ---
        const faceMesh = new FaceMesh({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
        });

        faceMesh.setOptions({ 
            maxNumFaces: 1, 
            refineLandmarks: true, 
            minDetectionConfidence: 0.5, 
            minTrackingConfidence: 0.5 
        });

        faceMesh.onResults((results) => {
            const w = canvasElement.width = videoElement.videoWidth || 640;
            const h = canvasElement.height = videoElement.videoHeight || 480;

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, w, h);

            // Draw video frame to canvas
            canvasCtx.drawImage(results.image, 0, 0, w, h);

            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                facialLossStartTime = 0;
                const landmarks = results.multiFaceLandmarks[0];

                const leftEAR = calculateEAR(landmarks, true);
                const rightEAR = calculateEAR(landmarks, false);
                const ear = (leftEAR + rightEAR) / 2.0;
                const mar = calculateMAR(landmarks);
                
                const isSeatbeltOn = checkSeatbeltFastened(landmarks, w, h);

                // --- VISUAL VECTOR LINE DEBUGGER ---
                const chin = landmarks[152];
                const sX = chin.x * w;
                const sY = (chin.y * h) + (h * 0.10);
                const eX = Math.max(10, sX - (w * 0.35));
                const eY = Math.min(h - 10, sY + (h * 0.40));

                canvasCtx.beginPath();
                canvasCtx.moveTo(sX, sY);
                canvasCtx.lineTo(eX, eY);
                canvasCtx.strokeStyle = isSeatbeltOn ? "#00ffcc" : "#ff00ea";
                canvasCtx.lineWidth = 5;
                canvasCtx.stroke();

                // --- 6-STATE PRIORITY RULE ENGINE ---
                if (!isSeatbeltOn) {
                    updateStatus("STATE 6: NO SEATBELT DETECTED", `Scan Vector Failed | EAR: ${ear.toFixed(2)} | MAR: ${mar.toFixed(2)}`, "Fasten Seatbelt Across Torso", "#ff00ea");
                } else if (phoneDetected) {
                    updateStatus("STATE 5: DISTRACTED (PHONE USE)", "Mobile Device Tracked in View", "Put Down Mobile Phone", "#ff0055");
                } else if (ear < 0.17) {
                    updateStatus("STATE 2: MICROSLEEP DETECTED", `EAR = ${ear.toFixed(2)} (< 0.17 Threshold)`, "CRITICAL ALERT: Driver Drowsy!", "#ff3300");
                } else if (mar > 0.50) {
                    updateStatus("STATE 3: YAWNING DETECTED", `MAR = ${mar.toFixed(2)} (> 0.50 Threshold)`, "Warning: Rest Required", "#ffcc00");
                } else {
                    updateStatus("STATE 1: SAFE DRIVING", `EAR: ${ear.toFixed(2)} | MAR: ${mar.toFixed(2)} | Seatbelt: FASTENED`, "Normal Operating Mode", "#00ffcc");
                }
            } else {
                const currentTime = Date.now();
                if (facialLossStartTime === 0) {
                    facialLossStartTime = currentTime;
                } else if (currentTime - facialLossStartTime > 2500) {
                    updateStatus("STATE 4: CRITICAL FACIAL LOSS", "Face Un-tracked > 2.5 Seconds", "Focus Eyes on Road Immediately", "#ff0000");
                    canvasCtx.restore();
                    return;
                }
                updateStatus("TRACKING FACE...", "Searching for facial mesh", "Monitoring", "#aaaaaa");
            }
            canvasCtx.restore();
        });

        const camera = new Camera(videoElement, {
            onFrame: async () => { await faceMesh.send({ image: videoElement }); },
            width: 640,
            height: 480
        });
        camera.start();

        function updateStatus(state, metric, action, color) {
            statusBox.style.borderColor = color;
            statusBox.innerHTML = `
                <div class="state-title" style="color:${color}">${state}</div>
                <div class="metrics">${metric}</div>
                <div style="font-size: 13px; color: #fff; margin-top: 4px;"><strong>Action:</strong> ${action}</div>
            `;
        }
    </script>
</body>
</html>
